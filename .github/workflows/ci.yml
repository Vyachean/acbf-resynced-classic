name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-contract:
    name: repository-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify docs and required project structure
        run: python3 scripts/check_repo.py

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run deterministic, off-game tests
        run: python3 -m unittest discover -s tests -v
      - name: Test original AC4 journal analyzer
        run: python3 -m unittest discover -s tools/ac4_observer -p 'test_*.py' -v

  ac4-observer-x86:
    name: ac4-observer-x86
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure original AC4 x86 observer (no private target profile)
        run: cmake -S tools/ac4_observer -B build-ac4-observer -A Win32
      - name: Build x86 ASI and synthetic host
        run: cmake --build build-ac4-observer --config Release --parallel 2
      - name: Test x86 load, mismatch refusal, journal stop, and byte guard
        run: ctest --test-dir build-ac4-observer -C Release --output-on-failure

  windows-build:
    name: windows-build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect buildable source
        id: source
        shell: pwsh
        run: |
          if (Test-Path CMakeLists.txt) {
            "available=true" >> $env:GITHUB_OUTPUT
          } else {
            "available=false" >> $env:GITHUB_OUTPUT
            Write-Host "Research/documentation phase: no CMakeLists.txt; no game mod is built."
          }

      - name: Configure Windows x64
        if: steps.source.outputs.available == 'true'
        run: cmake -S . -B build -A x64

      - name: Compile Windows x64
        if: steps.source.outputs.available == 'true'
        run: cmake --build build --config Release --parallel

      - name: Test Windows build
        if: steps.source.outputs.available == 'true'
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error

      - name: Select artifact type
        id: payload
        shell: pwsh
        run: |
          $diagnostic = Test-Path "packaging/diagnostic.json"
          $playable = Test-Path "packaging/installable.json"
          if ($diagnostic -and $playable) {
            throw "Only one package type can be enabled in a commit."
          }
          if ($diagnostic) {
            $meta = Get-Content "packaging/diagnostic.json" -Raw | ConvertFrom-Json
            if ($meta.kind -ne "diagnostic" -or $meta.gameplay_modification) {
              throw "Invalid read-only diagnostic manifest."
            }
            "kind=diagnostic" >> $env:GITHUB_OUTPUT
          } elseif ($playable) {
            "kind=playable" >> $env:GITHUB_OUTPUT
          } else {
            "kind=none" >> $env:GITHUB_OUTPUT
            Write-Host "Offline tests only; no distributable payload."
          }

      - name: Stage project-owned files
        if: steps.payload.outputs.kind != 'none'
        run: cmake --install build --config Release --prefix staging

      - name: Package isolated diagnostic hosts
        if: steps.payload.outputs.kind == 'diagnostic'
        shell: pwsh
        run: |
          $files = @(Get-ChildItem staging -Recurse -File)
          $asi = @(Get-ChildItem staging -Recurse -Filter "ACBFClassicDiagnostics.asi" -File)
          $pn = @(Get-ChildItem staging -Recurse -Filter "ACBFClassicPuppetPlugin.dll" -File)
          if ($files.Count -ne 2 -or $asi.Count -ne 1 -or $pn.Count -ne 1) {
            throw "Staging must contain exactly the original ASI and Puppet DLL."
          }
          $root = (Resolve-Path staging).Path
          $relAsi = [System.IO.Path]::GetRelativePath($root, $asi[0].FullName)
          $relPn = [System.IO.Path]::GetRelativePath($root, $pn[0].FullName)
          if ($relAsi -ne "ACBFClassicDiagnostics.asi" -or
              $relPn -ne "PuppetNative\plugins\ACBFClassicPuppetPlugin.dll") {
            throw "Unexpected paths: no archive published."
          }
          # Mutually exclusive operator choices. Never ship a test-only xinput.dll.
          New-Item -ItemType Directory "dist/stage-asi" -Force | Out-Null
          New-Item -ItemType Directory "dist/stage-pn/PuppetNative/plugins" -Force | Out-Null
          Copy-Item $asi[0].FullName "dist/stage-asi/"
          Copy-Item $pn[0].FullName "dist/stage-pn/PuppetNative/plugins/"
          Copy-Item README.md, LICENSE.md, packaging/diagnostic.json -Destination "dist/stage-asi/"
          Copy-Item README.md, LICENSE.md, packaging/diagnostic.json -Destination "dist/stage-pn/"
          Copy-Item docs/DIAGNOSTICS.md -Destination "dist/stage-asi/"
          Copy-Item docs/DIAGNOSTICS.md, docs/PUPPET_NATIVE.md -Destination "dist/stage-pn/"
          Copy-Item THIRD_PARTY_NOTICES/PUPPET_NATIVE.md -Destination "dist/stage-pn/"
          Compress-Archive -Path "dist/stage-asi/*" -DestinationPath "dist/acbf-asi-diagnostic-$env:GITHUB_SHA.zip"
          Compress-Archive -Path "dist/stage-pn/*" -DestinationPath "dist/acbf-puppet-diagnostic-$env:GITHUB_SHA.zip"

      - name: Refuse premature playable packaging
        if: steps.payload.outputs.kind == 'playable'
        shell: pwsh
        run: throw "Playable packaging requires independently verified game action integration."

      - name: Upload Windows artifact
        if: steps.payload.outputs.kind == 'diagnostic'
        uses: actions/upload-artifact@v4
        with:
          name: acbf-diagnostics-${{ github.sha }}
          path: dist/acbf-*.zip
          if-no-files-found: error
          retention-days: 14

  version-main:
    name: version-main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [repository-contract, unit-tests, windows-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: publish-main-versions
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Tag a validated squash merge (not a GitHub Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_version.py
