name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-contract:
    name: repository-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify docs and required project structure
        run: python3 scripts/check_repo.py

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run deterministic, off-game tests
        run: python3 -m unittest discover -s tests -v

  windows-build:
    name: windows-build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect buildable source
        id: source
        shell: pwsh
        run: |
          if (Test-Path CMakeLists.txt) {
            "available=true" >> $env:GITHUB_OUTPUT
          } else {
            "available=false" >> $env:GITHUB_OUTPUT
            Write-Host "Research/documentation phase: no CMakeLists.txt; no game mod is built."
          }

      - name: Configure Windows x64
        if: steps.source.outputs.available == 'true'
        run: cmake -S . -B build -A x64

      - name: Compile Windows x64
        if: steps.source.outputs.available == 'true'
        run: cmake --build build --config Release --parallel

      - name: Test Windows build
        if: steps.source.outputs.available == 'true'
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error

      - name: Select artifact type
        id: payload
        shell: pwsh
        run: |
          $diagnostic = Test-Path "packaging/diagnostic.json"
          $playable = Test-Path "packaging/installable.json"
          if ($diagnostic -and $playable) {
            throw "Only one package type can be enabled in a commit."
          }
          if ($diagnostic) {
            $meta = Get-Content "packaging/diagnostic.json" -Raw | ConvertFrom-Json
            if ($meta.kind -ne "diagnostic" -or $meta.gameplay_modification) {
              throw "Invalid read-only diagnostic manifest."
            }
            "kind=diagnostic" >> $env:GITHUB_OUTPUT
          } elseif ($playable) {
            "kind=playable" >> $env:GITHUB_OUTPUT
          } else {
            "kind=none" >> $env:GITHUB_OUTPUT
            Write-Host "Offline tests only; no distributable payload."
          }

      - name: Stage project-owned files
        if: steps.payload.outputs.kind != 'none'
        run: cmake --install build --config Release --prefix staging

      - name: Create CI artifact archive
        if: steps.payload.outputs.kind != 'none'
        shell: pwsh
        run: |
          if (-not (Test-Path staging)) { throw "No staging directory." }
          $asi = @(Get-ChildItem staging -Recurse -Filter "*.asi" -File)
          if ($asi.Count -ne 1) { throw "Expected exactly one ASI; got $($asi.Count)." }
          $forbidden = @(Get-ChildItem staging -Recurse -File |
            Where-Object { $_.Extension -in @(".exe", ".forge", ".fat", ".pak") -or $_.Name -eq "version.dll" })
          if ($forbidden.Count -ne 0) { throw "Forbidden third-party or game payload in staging." }
          Copy-Item README.md, LICENSE.md -Destination staging -Force
          if ("${{ steps.payload.outputs.kind }}" -eq "diagnostic") {
            Copy-Item docs/DIAGNOSTICS.md -Destination staging -Force
            Copy-Item packaging/diagnostic.json -Destination staging -Force
          }
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -Path staging/* -DestinationPath "dist/acbf-${{ steps.payload.outputs.kind }}-$env:GITHUB_SHA.zip" -Force

      - name: Upload Windows artifact
        if: steps.payload.outputs.kind != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: acbf-${{ steps.payload.outputs.kind }}-${{ github.sha }}
          path: dist/acbf-*.zip
          if-no-files-found: error
          retention-days: 14

  version-main:
    name: version-main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [repository-contract, unit-tests, windows-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: publish-main-versions
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Tag a validated squash merge (not a GitHub Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_version.py
